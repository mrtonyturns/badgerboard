<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Wisconsin flag stripe background -->
  <rect width="40" height="40" rx="6" fill="#1E3A5F"/>

  <!-- Stylized badger face -->
  <!-- White center stripe -->
  <rect x="18" y="6" width="4" height="20" rx="2" fill="white" opacity="0.9"/>
  <!-- Left ear -->
  <ellipse cx="11" cy="12" rx="5" ry="7" fill="white" opacity="0.85"/>
  <ellipse cx="11" cy="12" rx="3" ry="5" fill="#B91C1C" opacity="0.9"/>
  <!-- Right ear -->
  <ellipse cx="29" cy="12" rx="5" ry="7" fill="white" opacity="0.85"/>
  <ellipse cx="29" cy="12" rx="3" ry="5" fill="#B91C1C" opacity="0.9"/>
  <!-- Face body -->
  <ellipse cx="20" cy="22" rx="12" ry="10" fill="#4A4A4A"/>
  <!-- White center face stripe -->
  <rect x="18.5" y="13" width="3" height="17" rx="1.5" fill="white" opacity="0.95"/>
  <!-- Eyes -->
  <circle cx="15" cy="20" r="2" fill="white"/>
  <circle cx="25" cy="20" r="2" fill="white"/>
  <circle cx="15.5" cy="20" r="1" fill="#1E3A5F"/>
  <circle cx="25.5" cy="20" r="1" fill="#1E3A5F"/>
  <!-- Nose -->
  <ellipse cx="20" cy="26" rx="2.5" ry="1.5" fill="#2A2A2A"/>
  <!-- Wisconsin "W" subtle -->
  <text x="20" y="37" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="white" opacity="0.7" text-anchor="middle">WI</text>
</svg>
