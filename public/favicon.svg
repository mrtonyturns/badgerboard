<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="32"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="100%" stop-color="#aa0000"/>
    </linearGradient>
  </defs>
  <!-- Navy background -->
  <circle cx="32" cy="32" r="32" fill="#1e3a5f"/>
  <!-- Wisconsin tri-color bar clipped to circle -->
  <g clip-path="url(#c)">
    <rect x="0"    y="54" width="21.3" height="10" fill="#cc0000"/>
    <rect x="21.3" y="54" width="21.4" height="10" fill="#ffffff"/>
    <rect x="42.7" y="54" width="21.3" height="10" fill="#1d4ed8"/>
  </g>
  <!-- Bold "B" -->
  <text x="32" y="45" font-family="Georgia,serif" font-size="40" font-weight="bold"
    text-anchor="middle" fill="url(#bg)">B</text>
</svg>
